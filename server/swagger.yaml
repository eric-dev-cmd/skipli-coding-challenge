openapi: 3.0.0
info:
  title: Skipli API
  version: 1.0.0
  description: API documentation for Skipli application
paths:
  /users:
    get:
      summary: Get all users
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "API users"

  /auth/code:
    post:
      summary: Create new access code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - phoneNumber
              properties:
                phoneNumber:
                  type: string
                  example: "+1234567890"
      responses:
        "200":
          description: Access code created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true

  /auth/verify:
    post:
      summary: Validate access code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - phoneNumber
                - accessCode
              properties:
                phoneNumber:
                  type: string
                  example: "+1234567890"
                accessCode:
                  type: string
                  example: "123456"
      responses:
        "200":
          description: Code validated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        "400":
          description: Invalid code
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: "Invalid code"

  /github/search:
    get:
      summary: Search GitHub users
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
          description: Search query
        - name: page
          in: query
          schema:
            type: integer
            default: 1
          description: Page number
        - name: per_page
          in: query
          schema:
            type: integer
            default: 10
          description: Results per page
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_count:
                    type: integer
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        login:
                          type: string
                        avatar_url:
                          type: string
                        html_url:
                          type: string
                        public_repos:
                          type: integer
                        followers:
                          type: integer

  /github/{id}:
    get:
      summary: Get GitHub user profile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: GitHub user ID
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  login:
                    type: string
                  avatar_url:
                    type: string
                  html_url:
                    type: string
                  public_repos:
                    type: integer
                  followers:
                    type: integer
